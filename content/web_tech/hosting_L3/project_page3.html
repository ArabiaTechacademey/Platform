<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Projects</title>
<link rel="icon" type="image/png" href="../image/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..800&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #0056D2;
    --primary-light: #e8f0fe;
    --success: #0a8a3c;
    --success-light: #e8f5e9;
    --text: #1a1a2e;
    --text-mid: #595959;
    --text-muted: #767676;
    --border: #e0e0e0;
    --bg: #f8f9fa;
    --white: #ffffff;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
}

.header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
}

.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

.header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }

.logo-text h1 { font-size: 30px; color: var(--text); font-weight: 700; }
.logo-text p { font-size: 12px; color: var(--text-muted); }

.page-wrapper {
    display: flex;
    max-width: 1400px;
    margin: 0 auto;
    gap: 0;
}

.sidebar {
    width: 280px;
    background: var(--white);
    border-left: 1px solid var(--border);
    position: sticky;
    top: 81px;
    height: calc(100vh - 81px);
    overflow-y: auto;
    flex-shrink: 0;
}

.sidebar-header {
    padding: 24px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, var(--primary), #0041a8);
    color: white;
}

.sidebar-header h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.sidebar-header p { font-size: 13px; opacity: 0.9; }

.sidebar-projects { padding: 12px 8px; }

.sidebar-project {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    margin-bottom: 6px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
}

.sidebar-project:hover { background: var(--primary-light); border-color: var(--primary); }
.sidebar-project.active {
    background: var(--primary-light);
    border-color: var(--primary);
    box-shadow: 0 2px 8px rgba(0, 86, 210, 0.15);
}

.sidebar-project-number {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--primary), #0041a8);
    color: white; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; flex-shrink: 0;
}

.sidebar-project.active .sidebar-project-number {
    background: linear-gradient(135deg, var(--success), #087030);
    transform: scale(1.05);
}

.sidebar-project-info { flex: 1; min-width: 0; }
.sidebar-project-info .title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.sidebar-project-info .meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sidebar-project-info .lesson-name { font-size: 11.5px; color: var(--primary); font-weight: 600; }

.level-badge {
    display: inline-block;
    padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600;
}
.level-beginner   { background: #e8f5e9; color: #0a8a3c; }
.level-intermediate { background: #fff3e0; color: #f57c00; }
.level-advanced   { background: #fce4ec; color: #c2185b; }

.main { flex: 1; padding: 40px 32px 80px; overflow-x: hidden; }

.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
}

.info-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
.info-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.info-icon { width: 48px; height: 48px; background: var(--primary-light); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.info-card h3 { font-size: 16px; font-weight: 700; color: var(--text); }
.info-card p { color: var(--text-mid); font-size: 14px; line-height: 1.7; }
.info-card .highlight {
    background: var(--success-light); color: var(--success);
    padding: 4px 12px; border-radius: 6px; font-weight: 600;
    display: inline-block; margin-top: 12px; font-size: 13px;
}

.preview-section {
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
}

.preview-header {
    background: #f8f9fa;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
}

.preview-header h3 { font-size: 18px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 10px; }

.btn-group { display: flex; gap: 12px; flex-wrap: wrap; }

.btn {
    padding: 10px 20px; border-radius: 8px;
    font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; border: none; transition: all 0.2s;
    text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
}

.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #0041a8; transform: translateY(-1px); }
.btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); }
.btn-outline:hover { background: var(--primary-light); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover { background: #087030; }

.preview-image-wrap {
    position: relative;
    background: #f5f5f5;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.preview-image {
    width: 100%;
    max-height: 600px;
    object-fit: contain;
    background: #f5f5f5;
    display: block;
}

.code-section {
    background: var(--white); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow); margin-bottom: 32px;
}

.code-header {
    background: #2d3748; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
}

.code-header-left { display: flex; align-items: center; gap: 12px; }
.code-dots { display: flex; gap: 6px; }
.code-dots span { width: 12px; height: 12px; border-radius: 50%; }
.code-dots .red    { background: #ff5f57; }
.code-dots .yellow { background: #febc2e; }
.code-dots .green  { background: #28ca42; }

.code-lang { background: var(--success-light); color: var(--success); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; }

.code-content {
    background: #1a202c; color: #e2e8f0;
    padding: 24px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px; line-height: 1.8;
    overflow-x: auto; max-height: 500px; overflow-y: auto;
    direction: ltr; text-align: left;
}

.code-content::-webkit-scrollbar { width: 8px; height: 8px; }
.code-content::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }

.empty-state { text-align: center; padding: 80px 20px; }
.empty-state-icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
.empty-state h3 { font-size: 24px; color: var(--text); margin-bottom: 12px; }
.empty-state p  { color: var(--text-mid); font-size: 16px; }

.back {
    display: inline-block; width: 12px; height: 12px;
    border-left: 3px solid black; border-bottom: 3px solid black;
    transform: rotate(45deg);
}

@media (max-width: 960px) {
    .page-wrapper { flex-direction: column; }
    .sidebar { width: 100%; position: relative; top: 0; height: auto; border-left: none; border-top: 1px solid var(--border); }
    .sidebar-projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 20px 16px; }
    .main { padding: 24px 22px 56px; }
    .info-grid { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
    .header-content { flex-direction: column; align-items: flex-start; }
    .main { padding: 18px 14px 48px; }
    .sidebar-projects { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .btn-group { width: 100%; flex-direction: column; }
    .btn { width: 100%; justify-content: center; }
}
</style>
</head>

}

`body {
    text-align: center;
    font-family: Arial;
    direction: rtl;
}

.circle {
    display: inline-block;
    margin: 10px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
}

.square {
    display: inline-block;
    margin: 10px;
    width: 80px;
    height: 80px;
}`,

code3:
`function drawShapes() {
    const shape = document.getElementById("shape").value;
    const color = document.getElementById("color").value;
    const count = Number(document.getElementById("count").value);

    let output = "";

    for (let i = 0; i < count; i++) {
        output += \`
            <div class="\${shape}"
                 style="background:\${color};">
            </div>\`;
    }

    document.getElementById("result").innerHTML = output;
}`

},

`function startGame() {
    let secret = Math.floor(Math.random() * 10) + 1;
    let guess = 0;
    let tries = 0;

    while (guess !== secret) {
        guess = Number(prompt("أدخل رقمًا من 1 إلى 10"));
        tries++;

        if (guess < secret) {
            alert("📈 الرقم أكبر");
        } 
        else if (guess > secret) {
            alert("📉 الرقم أصغر");
        }
    }

    document.getElementById("result").innerHTML =
        \`🎉 أحسنت! الرقم هو \${secret}<br>عدد المحاولات: \${tries}\`;
}`

`function checkPassword() {

    let password = document.getElementById("password").value;
    let result = document.getElementById("result");

    let hasNumber = false;
    let hasLetter = false;

    for (let i = 0; i < password.length; i++) {

        if (password[i] >= "0" && password[i] <= "9") {
            hasNumber = true;
        }

        if (
            (password[i] >= "a" && password[i] <= "z") ||
            (password[i] >= "A" && password[i] <= "Z")
        ) {
            hasLetter = true;
        }
    }

    if (!hasNumber || !hasLetter) {

        result.innerHTML =
            "❌ Password must contain letters and numbers";

    }

    else if (password.length < 6) {

        result.innerHTML = "🔴 Weak Password";

    }

    else if (password.length < 10) {

        result.innerHTML = "🟠 Medium Password";

    }

    else {

        result.innerHTML = "🟢 Strong Password";

    }
}`
