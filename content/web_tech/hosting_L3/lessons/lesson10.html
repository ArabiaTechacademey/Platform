<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 60px;
        }

        .calculator {
            background: white;
            width: 300px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            cursor: pointer;
        }

        #result {
            font-size: 22px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>🧮 Calculator</h1>

        <input type="number" id="num1" placeholder="First Number">

        <input type="number" id="num2" placeholder="Second Number">

        <br>

        <button onclick="add()">+</button>
        <button onclick="subtract()">-</button>
        <button onclick="multiply()">×</button>
        <button onclick="divide()">÷</button>

        <div id="result">Result: </div>

    </div>

    <script>

        function add() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").innerHTML =
                "Result: " + (num1 + num2);
        }

        function subtract() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").innerHTML =
                "Result: " + (num1 - num2);
        }

        function multiply() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").innerHTML =
                "Result: " + (num1 * num2);
        }

        function divide() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            if (num2 == 0) {
                document.getElementById("result").innerHTML =
                    "Cannot divide by zero";
            }
            else {
                document.getElementById("result").innerHTML =
                    "Result: " + (num1 / num2);
            }
        }

    </script>

</body>
</html>
