<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لعبة تخمين الرقم</title>
  <style>
    body{
      font-family: Arial;
      direction: rtl;
      background: linear-gradient(135deg,#667eea,#764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container{
      background: white;
      width: 400px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    h2{
      color: #333;
      margin-bottom: 20px;
    }

    button{
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #result{
      margin-top: 20px;
      font-size: 20px;
      color: #333;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎯 لعبة تخمين الرقم</h2>
  <p>خمن رقمًا من 1 إلى 10</p>

  <button onclick="startGame()">ابدأ اللعبة</button>

  <div id="result"></div>
</div>
<script>
    
function startGame() {
  let secret = Math.floor(Math.random() * 10) + 1;
  let guess = 0;
  let tries = 0;

  while (guess !== secret) {
    guess = Number(prompt("أدخل رقمًا من 1 إلى 10"));
    tries++;

    if (guess < secret) {
      alert("📈 الرقم أكبر");
    } else if (guess > secret) {
      alert("📉 الرقم أصغر");
    }
  }

  document.getElementById("result").innerHTML =
    `🎉 أحسنت! الرقم هو ${secret}<br>عدد المحاولات: ${tries}`;
}
</script>

</body>
</html>
