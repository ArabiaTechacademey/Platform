<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Cards</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    width:220px;
    background:white;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.card img{
    width:100px;
    height:100px;
    border-radius:50%;
    margin-bottom:15px;
}

.card h2{
    color:#333;
    margin-bottom:10px;
}

.card p{
    color:#777;
}
</style>

</head>
<body>

<h1>Our Students</h1>

<div class="container" id="students"></div>

<script>

let students = [
    "Ahmed",
    "Mohamed",
    "Sara",
    "Mona",
    "Ali",
    "Youssef",
    "Omar",
    "Laila"
];

let container = document.getElementById("students");

for(let i = 0; i < students.length; i++){

    container.innerHTML += `
        <div class="card">
            
            <h2>${students[i]}</h2>
            <p>Web Development Student</p>
        </div> `;

}

</script>

</body>
</html>
