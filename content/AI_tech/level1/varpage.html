<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/png" href="../image/icon1.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #1e2530;
  --surface3:  #2a3344;
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.14);
  --text:      #e6edf3;
  --text-soft: #8b949e;
  --accent:    #f0a500;
  --accent-dim:#c07c00;
  --green:     #3ec98f;
  --mono:      'JetBrains Mono', monospace;
  --sans:      'Cairo', sans-serif;
  --radius:    10px;
}

html { font-size: 15px; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 20px;
}

/* ── Top bar ── */
.topbar {
  max-width: 1100px;
  margin: 0 auto 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(240,165,0,0.18);
}

.brand-name {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-soft);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.session-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 50px;
  padding: 8px 20px;
  font-size: 0.9rem;
  color: var(--text-soft);
}

.session-pill .num {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 500;
  color: var(--accent);
}

/* ── Main grid ── */
.layout {
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1.7fr;
  gap: 20px;
  align-items: start;
}

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  direction: rtl;
}

.card-header-icon {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--surface3);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.card-header-icon svg { width: 16px; height: 16px; fill: var(--accent); }

.card-header-title {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-soft);
  letter-spacing: 0.04em;
}

/* ── Image card ── */
.image-wrap {
  padding: 16px;
  background: var(--surface2);
}

.preview-img {
  width: 100%;
  border-radius: var(--radius);
  display: block;
  max-height: 340px;
  object-fit: contain;
  background: #0d1117;
}

/* ── Metadata strip below image ── */
.meta-strip {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  direction: rtl;
  gap: 10px;
}

.meta-label {
  font-size: 0.8rem;
  color: var(--text-soft);
}

.drive-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--green);
  text-decoration: none;
  padding: 5px 12px;
  border: 1px solid rgba(62,201,143,0.25);
  border-radius: 6px;
  transition: background 0.15s, border-color 0.15s;
}

.drive-link:hover {
  background: rgba(62,201,143,0.08);
  border-color: rgba(62,201,143,0.45);
}

.drive-link svg { width: 14px; height: 14px; fill: var(--green); }

/* ── Code card ── */
.code-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  direction: ltr;
}

.lang-badge {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--accent);
  background: rgba(240,165,0,0.1);
  border: 1px solid rgba(240,165,0,0.2);
  border-radius: 5px;
  padding: 2px 9px;
  letter-spacing: 0.04em;
}

.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text-soft);
  font-family: var(--sans);
  font-size: 0.8rem;
  padding: 5px 12px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}

.copy-btn:hover { color: var(--text); border-color: var(--border2); }
.copy-btn.copied { color: var(--green); border-color: rgba(62,201,143,0.35); }

.copy-btn svg { width: 13px; height: 13px; fill: currentColor; }

.code-scroll {
  overflow: auto;
  max-height: 62vh;
  padding: 16px 18px;
  direction: ltr;
}

.code-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.code-scroll::-webkit-scrollbar-track { background: transparent; }
.code-scroll::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

.code-pre {
  font-family: var(--mono);
  font-size: 0.82rem;
  line-height: 1.7;
  color: #cdd9e5;
  white-space: pre;
  tab-size: 4;
}

/* ── Error ── */
.error-card {
  max-width: 1100px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid rgba(240,165,0,0.25);
  border-top: 3px solid var(--accent);
  border-radius: 14px;
  padding: 36px;
  text-align: center;
  direction: rtl;
}

.error-card h3 { font-size: 1.1rem; margin-bottom: 10px; }
.error-card p { color: var(--text-soft); font-size: 0.88rem; font-family: var(--mono); margin-top: 6px; }

/* ── Responsive ── */
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  .topbar { flex-direction: column; align-items: flex-start; }
  body { padding: 20px 14px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

function convertImg(url){
  const m = url.match(/\/d\/([a-zA-Z0-9\-_]+)/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w700-h500` : url;
}
function convertDL(url){
  const m = url.match(/\/d\/([a-zA-Z0-9\-_]+)/);
  return m ? `https://drive.google.com/uc?export=download&id=${m[1]}` : url;
}
function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function getParam(){
  const p = new URLSearchParams(window.location.search);
  return p.get('number') || p.get('id') || p.get('n') ||
    (window.location.pathname.match(/\/(\d+)$/) || [])[1] || null;
}

        </div>
        <div class="image-wrap">
          <img class="preview-img" src="${convertImg(content.image)}" alt="معاينة الجلسة ${num}">
        </div>
        <div class="meta-strip">
          <span class="meta-label">ملف الجلسة</span>
          <a class="drive-link" href="${convertDL(content.image)}" target="_blank">
            ${iconDrive}
            فتح في Drive
          </a>
        </div>
      </div>
    </div>

    <!-- Right: code -->
    <div>
      <div class="card">
        <div class="card-header">
          <div class="card-header-icon">${iconCode}</div>
          <span class="card-header-title">الكود المصدري</span>
        </div>
        <div class="code-toolbar">
          <span class="lang-badge">python</span>
          <button class="copy-btn" id="copyBtn" onclick="copyCode()">
            <span id="copyIcon">${iconCopy}</span>
            <span id="copyLabel">نسخ</span>
          </button>
        </div>
        <div class="code-scroll">
          <pre class="code-pre" id="codeContent">${escHtml(content.code)}</pre>
        </div>
      </div>
    </div>

  </div>`;
}

function copyCode(){
  const text = document.getElementById('codeContent').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById('copyBtn');
    const icon = document.getElementById('copyIcon');
    const lbl  = document.getElementById('copyLabel');
    btn.classList.add('copied');
    icon.innerHTML = iconCheck;
    lbl.textContent = 'تم النسخ';
    setTimeout(()=>{
      btn.classList.remove('copied');
      icon.innerHTML = iconCopy;
      lbl.textContent = 'نسخ';
    }, 2000);
  });
}
window.copyCode = copyCode;

render(getParam());
</script>
</body>
</html>
